plugins { id 'com.android.application' }

android {
    namespace 'org.karidz.sutsurvey'
    compileSdk 35

    defaultConfig {
        applicationId 'org.karidz.sutsurvey'
        minSdk 24
        targetSdk 35
        versionCode 1
        versionName '1.0'
        resConfigs "fr", "en"
    }


    buildTypes {
        debug {
            applicationIdSuffix ""
        }
        release {
            minifyEnabled false
            shrinkResources false
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    packagingOptions {
        resources.excludes += ['META-INF/*']
    }
}

/* Signature centralisée (CI / local / debug) */
apply from: "$rootDir/signing.gradle"
