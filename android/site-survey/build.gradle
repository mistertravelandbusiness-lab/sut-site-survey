plugins { id 'com.android.application' }

android {
    namespace 'org.karidz.sutsurvey'
    compileSdk 35

    defaultConfig {
        applicationId 'org.karidz.sutsurvey'
        minSdk 24
        targetSdk 35
        versionCode 1
        versionName '1.0'
        resConfigs "fr", "en"
    }

    signingConfigs {
        release {
            // CI : KEYSTORE_PATH / KEYSTORE_PASSWORD / KEY_ALIAS / KEY_PASSWORD
            // Fallback local : debug keystore
            storeFile file(System.getenv('KEYSTORE_PATH') ?: "${System.getProperty('user.home')}/.android/debug.keystore")
            storePassword System.getenv('KEYSTORE_PASSWORD') ?: 'android'
            keyAlias System.getenv('KEY_ALIAS') ?: 'androiddebugkey'
            keyPassword System.getenv('KEY_PASSWORD') ?: 'android'
        }
    }

    buildTypes {
        debug {
            applicationIdSuffix ""
        }
        release {
            minifyEnabled false
            shrinkResources false
            signingConfig signingConfigs.release
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    packagingOptions {
        resources.excludes += ['META-INF/*']
    }
}
