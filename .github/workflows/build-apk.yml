name: Build APKs — SUT (Admin + Utilisateur)

# Méthode reprise du repo de référence (ribeiro) :
#   projets Gradle multi-modules, un module par APK, les assets web sont
#   copiés depuis <app>-app/ vers android/<module>/src/main/assets/www
#   par android/prepare_assets.sh, puis vérification des APK et publication
#   en release GitHub.

on:
  push:
    branches: [main]
    paths:
      - 'android/**'
      - 'admin-app/**'
      - 'user-app/**'
      - '.github/workflows/build-apk.yml'
  workflow_dispatch:

jobs:
  smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Contrôles web (bloquant)
        run: |
          set -e
          for f in admin-app/js/*.js user-app/js/*.js; do node --check "$f"; done
          nohup python3 -m http.server 8091 --directory admin-app >/tmp/a.log 2>&1 &
          nohup python3 -m http.server 8092 --directory user-app  >/tmp/u.log 2>&1 &
          sleep 2
          for P in 8091 8092; do
            curl -s -o /dev/null -w "port $P index %{http_code}\n" http://localhost:$P/
            for f in index.html css/app.css js/app.js js/report.js js/export.js js/admin.js \
                     vendor/supabase.js vendor/xlsx.full.min.js img/icon-512.png; do
              code=$(curl -s -o /dev/null -w "%{http_code}" "http://localhost:$P/$f")
              test "$code" = "200" || (echo "ASSET MANQUANT ($P) $f" && exit 1)
            done
            curl -s http://localhost:$P/ | grep -q "supabase.js" || (echo "supabase-js non chargé ($P)" && exit 1)
          done
          # rôles distincts
          grep -q '__APP_ROLE = "admin"' admin-app/index.html || (echo "admin-app sans APP_ROLE=admin" && exit 1)
          grep -q '__APP_ROLE = "user"'  user-app/index.html  || (echo "user-app sans APP_ROLE=user" && exit 1)
          # aucune clé privilégiée dans le front
          if grep -rq "sb_secret_\|service_role" admin-app/js user-app/js; then echo "DANGER: clé privilégiée"; exit 1; fi
          echo "SMOKE OK"

  build:
    needs: [smoke]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          cmdline-tools-version: 11076708
          packages: platform-tools platforms;android-35 build-tools;35.0.0

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.7

      - name: Prépare les assets des 2 apps
        run: bash android/prepare_assets.sh

      - name: Keystore de signature stable
        env:
          SUT_KEY_PEM_B64: ${{ secrets.SUT_KEY_PEM_B64 }}
          SUT_CERT_PEM_B64: ${{ secrets.SUT_CERT_PEM_B64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          set -e
          python3 -m pip install --quiet --upgrade cryptography || pip install --quiet --upgrade cryptography || true
          rm -f /tmp/sut-release.p12
          if python3 android/make_keystore.py /tmp/sut-release.p12 && [ -s /tmp/sut-release.p12 ]; then
            echo "KEYSTORE_PATH=/tmp/sut-release.p12" >> $GITHUB_ENV
            echo "signature STABLE (secrets GitHub)"
          else
            KT="$(command -v keytool || true)"
            [ -z "$KT" ] && [ -x "$JAVA_HOME/bin/keytool" ] && KT="$JAVA_HOME/bin/keytool"
            "$KT" -genkeypair -keystore /tmp/debug-ci.keystore -alias androiddebugkey \
              -keyalg RSA -keysize 2048 -validity 10950 -storepass android -keypass android \
              -dname "CN=Android Debug,O=Android,C=DZ"
            echo "KEYSTORE_PATH=/tmp/debug-ci.keystore" >> $GITHUB_ENV
            echo "::warning::Signature instable (keystore de secours keytool)"
            echo "KEYSTORE_PASSWORD=android"   >> $GITHUB_ENV
            echo "KEY_ALIAS=androiddebugkey"   >> $GITHUB_ENV
            echo "KEY_PASSWORD=android"        >> $GITHUB_ENV
          fi
          echo "KEYSTORE_PASSWORD=${KEYSTORE_PASSWORD:-android}" >> $GITHUB_ENV
          echo "KEY_ALIAS=${KEY_ALIAS:-androiddebugkey}" >> $GITHUB_ENV
          echo "KEY_PASSWORD=${KEY_PASSWORD:-android}" >> $GITHUB_ENV

      - name: Build des 2 APK (debug + release)
        run: gradle --project-dir android :admin:assembleDebug :user:assembleDebug :admin:assembleRelease :user:assembleRelease --stacktrace

      - name: Vérifie les APK (bloquant)
        run: |
          AAPT=$(ls $ANDROID_HOME/build-tools/*/aapt2 | head -1)
          for APK in android/admin/build/outputs/apk/release/admin-release.apk \
                     android/user/build/outputs/apk/release/user-release.apk \
                     android/admin/build/outputs/apk/debug/admin-debug.apk \
                     android/user/build/outputs/apk/debug/user-debug.apk; do
            echo "== $APK"
            SIZE=$(stat -c%s "$APK"); echo "   taille: $SIZE octets"
            test "$SIZE" -gt 500000 || (echo "APK SUSPECT" && exit 1)
            for f in assets/www/index.html assets/www/supabase-config.js assets/www/vendor/supabase.js \
                     assets/www/vendor/xlsx.full.min.js assets/www/img/examples/01-panorama.jpg; do
              unzip -l "$APK" | grep -q "$f" || (echo "MANQUANT $f dans $APK" && exit 1)
            done
            unzip -l "$APK" | grep -q "classes.dex" || (echo "DEX MANQUANT" && exit 1)
            $AAPT dump badging "$APK" | grep -E "^package:|^application-label|^launchable-activity" || (echo "BADGING ECHEC" && exit 1)
            $AAPT dump badging "$APK" | grep -q "application-icon" || (echo "ICONE MANQUANTE" && exit 1)
          done
          # les deux paquets doivent être DIFFÉRENTS
          P1=$($AAPT dump badging android/admin/build/outputs/apk/release/admin-release.apk | grep -o "package: name='[^']*'" )
          P2=$($AAPT dump badging android/user/build/outputs/apk/release/user-release.apk  | grep -o "package: name='[^']*'" )
          echo "admin: $P1"; echo "user: $P2"
          test "$P1" != "$P2" || (echo "Les 2 APK ont le même applicationId" && exit 1)

      - name: Vérifie la signature release (bloquant)
        run: |
          SIGNER=$(ls $ANDROID_HOME/build-tools/*/apksigner | head -1)
          for APK in android/admin/build/outputs/apk/release/admin-release.apk android/user/build/outputs/apk/release/user-release.apk; do
            $SIGNER verify --print-certs "$APK" | head -4 || (echo "SIGNATURE INVALIDE $APK" && exit 1)
          done

      - name: Renomme + checksums
        run: |
          mkdir -p dist
          cp android/admin/build/outputs/apk/release/admin-release.apk dist/SUT-Admin-v1.0.apk
          cp android/user/build/outputs/apk/release/user-release.apk   dist/SUT-Survey-v1.0.apk
          cp android/admin/build/outputs/apk/debug/admin-debug.apk     dist/SUT-Admin-v1.0-debug.apk
          cp android/user/build/outputs/apk/debug/user-debug.apk       dist/SUT-Survey-v1.0-debug.apk
          cd dist && sha256sum *.apk > CHECKSUMS.sha256 && ls -la

      - name: Publie la release (2 APK téléchargeables)
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0-apk-${{ github.run_number }}
          name: SUT — APK Admin + Utilisateur (build ${{ github.run_number }})
          body: |
            Deux applications installables :

            **SUT-Survey-v1.0.apk** — application terrain (utilisateurs)
            - inscription libre, chacun ne voit que ses rapports
            - rapports 2 pages, GPS, 10 emplacements photos (appareil + galerie)
            - export Excel nommé par Locality ID

            **SUT-Admin-v1.0.apk** — application administrateur
            - tableau de bord, liste des comptes
            - suppression d'un utilisateur
            - consultation de tous les rapports + export

            Installation : télécharger le `.apk`, autoriser « Installer des applications inconnues ».
          files: dist/*.apk
          draft: false
          prerelease: false

      - uses: actions/upload-artifact@v4
        continue-on-error: true
        with:
          name: sut-apks
          path: dist/
          retention-days: 14
