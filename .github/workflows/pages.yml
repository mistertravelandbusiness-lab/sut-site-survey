name: Deploy web (GitHub Pages)

on:
  push:
    branches: [main]
    paths:
      - 'web/**'
      - '.github/workflows/pages.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - name: Vérification (bloquant)
        run: |
          set -e
          for f in web/index.html web/css/app.css web/js/app.js web/js/report.js web/js/export.js web/js/admin.js \
                   web/js/fields.js web/js/photos.js web/js/ui.js web/vendor/supabase.js web/vendor/xlsx.full.min.js \
                   web/supabase-config.js web/manifest.json web/sw.js; do
            test -s "$f" || (echo "MANQUANT: $f" && exit 1)
          done
          grep -q 'createClient' web/js/app.js || (echo "app.js ne crée pas le client Supabase" && exit 1)
          grep -q '__SUPABASE_URL' web/supabase-config.js || (echo "config Supabase absente" && exit 1)
          if grep -rq 'service_role' web/ ; then echo "DANGER: service_role dans le front"; exit 1; fi
          for f in web/js/*.js; do node --check "$f"; done
          echo "VERIF OK"

      - name: Prépare l'artefact
        run: |
          mkdir -p dist
          cp -r web/. dist/
          rm -f dist/supabase-config.example.js
          echo "Artefact: $(find dist -type f | wc -l) fichiers, $(du -sh dist | cut -f1)"
          ls -la dist

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

      - id: deployment
        uses: actions/deploy-pages@v4
